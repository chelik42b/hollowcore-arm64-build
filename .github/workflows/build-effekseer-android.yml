name: Build EffekseerNativeForJava (arm64-v8a) and patch HollowCore jar

# Как использовать (без ручного копирования jar):
# 1. Создайте новый пустой репозиторий на GitHub.
# 2. Положите этот файл в .github/workflows/build-effekseer-android.yml
#    и файл patch_jar.py в корень репозитория.
# 3. Actions -> "Build EffekseerNativeForJava..." -> Run workflow.
# 4. Заберите готовый ФАЙЛ hc-1.19.2-1.6.3-arm64.jar из Artifacts —
#    это уже полностью готовый, подменённый jar, можно сразу класть в mods/.
#
# Workflow сам скачивает официальный jar с релиза HollowHorizon/HollowCore
# (тег latest-1.19.2) через GitHub API — вручную ничего заливать не нужно.
# Если вы хотите пропатчить свой собственный jar (например, локально собранный
# из исходников) — закомментируйте шаг "Download original HollowCore jar" и
# вместо него положите свой jar в корень репозитория под именем $JAR_NAME.
#
# ВАЖНО: кросс-компиляция C++ под Android редко проходит с первого раза без
# доработки — это нормально для такого портирования. Если сборка упадёт,
# приложите лог упавшего шага, разберём конкретную причину.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ANDROID_ABI: arm64-v8a
  ANDROID_PLATFORM: android-24
  JAR_NAME: hc-1.19.2-1.6.3.jar
  SOURCE_REPO: HollowHorizon/HollowCore
  SOURCE_TAG: latest-1.19.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (must contain patch_jar.py)
        uses: actions/checkout@v4

      - name: Install build deps (swig, cmake, ant, jdk, jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y swig cmake ninja-build ant openjdk-17-jdk python3 jq curl

      - name: Download original HollowCore jar from GitHub Releases
        run: |
          set -euo pipefail
          echo "Ищу asset '${JAR_NAME}' в релизе ${SOURCE_REPO}@${SOURCE_TAG}..."
          API_URL="https://api.github.com/repos/${SOURCE_REPO}/releases/tags/${SOURCE_TAG}"
          ASSET_URL=$(curl -sL "$API_URL" | jq -r --arg name "$JAR_NAME" \
            '.assets[] | select(.name == $name) | .browser_download_url')
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Точное имя не нашлось, ищу любой asset вида hc-1.19.2-*.jar..."
            ASSET_URL=$(curl -sL "$API_URL" | jq -r \
              '.assets[] | select(.name | test("^hc-1\\.19\\.2-.*\\.jar$")) | .browser_download_url' | head -n1)
          fi
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Не удалось найти jar автоматически. Список ассетов релиза:"
            curl -sL "$API_URL" | jq -r '.assets[].name'
            echo "Положите нужный jar вручную в корень репозитория под именем \$JAR_NAME и уберите этот шаг."
            exit 1
          fi
          echo "Скачиваю: $ASSET_URL"
          curl -sL -o "${JAR_NAME}" "$ASSET_URL"
          ls -la "${JAR_NAME}"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Clone EffekseerForMultiLanguages (official source)
        run: |
          git clone https://github.com/effekseer/EffekseerForMultiLanguages.git efml
          cd efml
          git submodule update --init --recursive

      - name: Generate SWIG wrapper (must match the JNI class already in HollowCore)
        run: |
          cd efml/src
          sh generate_swig_wrapper.sh

      - name: Strip desktop-only deps (OpenAL sound / desktop OpenGL-GLX) before Android configure
        # EffekseerForMultiLanguages' CMake was written for desktop (Windows/Linux/Mac) and
        # unconditionally pulls in: (1) the Dev/Cpp desktop viewer/tools tree, which needs
        # OpenAL (EffekseerSoundAL) — not available/relevant on Android, and (2) a
        # find_package(OpenGL) call that expects desktop GLX, not Android OpenGL ES.
        # This step comments those out so the Android configure step doesn't fail on them.
        # Best-effort: if the source layout changes, this may need adjusting — check the log.
        run: |
          set -e
          echo "--- Ищу add_subdirectory(...Dev/Cpp...) во всех CMakeLists.txt ---"
          grep -rlE 'add_subdirectory\([^)]*Dev/Cpp[^)]*\)' efml --include=CMakeLists.txt || true
          grep -rlE 'add_subdirectory\([^)]*Dev/Cpp[^)]*\)' efml --include=CMakeLists.txt | \
            xargs -r sed -i -E 's/^([[:space:]]*)(add_subdirectory\([^)]*Dev\/Cpp[^)]*\))/\1if(NOT ANDROID)\n\1  \2\n\1endif()/'

          echo "--- Делаю find_package(OpenGL) необязательным на Android ---"
          grep -rlE 'find_package\(\s*OpenGL' efml --include=CMakeLists.txt || true
          grep -rlE 'find_package\(\s*OpenGL' efml --include=CMakeLists.txt | \
            xargs -r sed -i -E 's/find_package\(\s*OpenGL\s+REQUIRED\s*\)/find_package(OpenGL)/g'

          echo "--- Готово, показываю изменённые файлы (git diff) ---"
          cd efml && git diff --stat || true

      - name: Configure CMake for Android arm64-v8a
        run: |
          cd efml
          cmake -B build-android -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ env.ANDROID_ABI }} \
            -DANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }} \
            -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee ../cmake-configure.log

      - name: List available CMake/Ninja build targets (diagnostics)
        run: |
          cd efml
          echo "--- Ninja targets (namelist) ---"
          ninja -C build-android -t targets namelist 2>&1 | tee ../ninja-targets.log || true
          echo "--- grep for Java/Effekseer-related targets ---"
          grep -iE 'java|effekseer' ../ninja-targets.log || true

      - name: Build
        run: |
          cd efml
          cmake --build build-android --config Release -j"$(nproc)" 2>&1 | tee ../cmake-build.log

      - name: Upload CMake logs (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: |
            cmake-configure.log
            cmake-build.log
            ninja-targets.log

      - name: Locate produced .so
        id: locate
        run: |
          set -e
          echo "--- Ищу любой .so с 'Effekseer' в имени по всему дереву efml (без ограничения глубины) ---"
          find efml -iname "*effekseer*.so" 2>/dev/null | tee all-effekseer-so.txt
          FOUND=$(grep -i "EffekseerNativeForJava" all-effekseer-so.txt | head -n1 || true)
          if [ -z "$FOUND" ]; then
            FOUND=$(head -n1 all-effekseer-so.txt || true)
          fi
          if [ -z "$FOUND" ]; then
            echo "Ни одного .so с Effekseer в имени не нашлось нигде в дереве efml."
            echo "Все .so файлы, которые вообще есть в build-android:"
            find efml/build-android -iname "*.so" || echo "(вообще ни одного .so файла)"
            exit 1
          fi
          echo "Найдено: $FOUND"
          echo "so_path=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Patch the jar (replace natives/EffekseerNativeForJava.so)
        run: |
          set -e
          cp "${{ steps.locate.outputs.so_path }}" ./EffekseerNativeForJava.so
          OUT_NAME="${JAR_NAME%.jar}-arm64.jar"
          echo "OUT_NAME=$OUT_NAME" >> "$GITHUB_ENV"
          python3 patch_jar.py "${JAR_NAME}" ./EffekseerNativeForJava.so "./$OUT_NAME"

      - name: Upload the finished jar
        uses: actions/upload-artifact@v4
        with:
          name: hollowcore-arm64-jar
          path: |
            ${{ env.OUT_NAME }}
            EffekseerNativeForJava.so
